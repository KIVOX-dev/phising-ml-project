name: Check Docker build

# Render deploys by itself on every push to main (auto-deploy).
# This workflow only checks that the Docker image still builds.
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "models/model.pkl"
      - "models/model_info.json"
      - "dataset/phishing_domains_1000.csv"
      - "requirements.txt"
      - "Dockerfile"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

jobs:
  build:
    name: Check the Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t phishing-detection-api .
